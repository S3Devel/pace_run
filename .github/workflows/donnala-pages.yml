name: Publicar Donnala

on:
  push:
    branches: ["donnala-site"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: donnala-site
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./donnala
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
